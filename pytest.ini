[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning 